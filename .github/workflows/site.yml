name: Site

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - '.github/workflows/site.yml'
  push:
    branches:
      - master
      # TEMP: first test deploy to workers.dev; drop before merging
      - site/static-export
    paths:
      - 'apps/site/**'
      - '.github/workflows/site.yml'
  # Stars and changelog are fetched at build time, so rebuild daily
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 2
  HUSKY: 0
  NODE_VERSION: 22

defaults:
  run:
    working-directory: apps/site

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Yarn cache
        uses: actions/cache@v4
        env:
          cache-name: yarn-cache-site
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('apps/site/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.cache-name }}-

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      # next build typechecks too, and it is the step that writes the
      # gitignored next-env.d.ts a standalone tsc run needs
      - name: Build
        run: yarn build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          wranglerVersion: '4.168.0'
